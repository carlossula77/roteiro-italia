<html lang="pt-BR"><head><meta charset="utf-8">

<title>Itália, novembro 2026</title>
<style>
:root{--bg:#E8ECE9;--card:#fff;--ink:#17221E;--muted:#5B6A64;--line:#CBD3CF;--mast:#1D4A3B;--ochre:#C98A12;--err:#A3341F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1915;--card:#17241F;--ink:#E7EEEA;--muted:#9AAAA3;--line:#2C3E37;--mast:#163A2E;--ochre:#E7B04A;--err:#E58A72;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--mast);color:#fff;padding:28px 22px 22px}
h1{margin:0;font-size:clamp(30px,8vw,44px);font-weight:800;line-height:1}
header p{margin:8px 0 0;opacity:.85}
main{flex:1;display:flex;justify-content:center;padding:28px 18px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
button{margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--mast);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.4em;margin:10px 0 0;font-size:14px;color:var(--muted)}
.msg.err{color:var(--err)}
.keep{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted);font-weight:400}
.keep input{width:18px;height:18px;padding:0}
</style></head>

const msg=document.getElementById('msg'), btn=document.getElementById('go');
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function open(pw,silent){
  const d=b64(BLOB), salt=d.slice(0,16), iv=d.slice(16,28), ct=d.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;
  try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){if(!silent){msg.textContent='Senha incorreta. Confira e tente de novo.';msg.className='msg err';btn.disabled=false;btn.textContent='Abrir roteiro'}return false}
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();return true;
}
try{const s=localStorage.getItem('it26-pw');if(s){msg.textContent='Abrindo…';open(s,true).then(ok=>{if(!ok){try{localStorage.removeItem('it26-pw')}catch(e){}msg.textContent=''}})}}catch(e){}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;
  btn.disabled=true;btn.textContent='Abrindo…';msg.textContent='';msg.className='msg';
  if(document.getElementById('keep').checked){try{localStorage.setItem('it26-pw',pw)}catch(e){}}
  await open(pw,false);
});
